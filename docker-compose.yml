services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tourist-tma-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tourist_tma}
      POSTGRES_USER: ${POSTGRES_USER:-tourist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourist_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL-миграция из Шага 1 применяется автоматически при первом старте
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourist} -d ${POSTGRES_DB:-tourist_tma}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: tourist-tma-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: tourist-tma-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Локальная разработка: hot-reload поверх прод-CMD из Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tourist}:${POSTGRES_PASSWORD:-tourist_secret}@db:5432/${POSTGRES_DB:-tourist_tma}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: tourist-tma-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # Telegram-бот @tourist_kg_bot (ТЗ §5): polling, нужен TELEGRAM_BOT_TOKEN + MINI_APP_URL в .env
  bot:
    build:
      context: ./backend
    container_name: tourist-tma-bot
    restart: unless-stopped
    command: python -m app.bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tourist}:${POSTGRES_PASSWORD:-tourist_secret}@db:5432/${POSTGRES_DB:-tourist_tma}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    profiles: ["bot"]

volumes:
  pgdata:
  redisdata:
